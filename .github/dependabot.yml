version: 2
updates:
  # Application dependencies — resolved against the public npm registry.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1 only;
      # TS 7 breaks `npm run lint`. Lift this once typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # Tailwind 4 moved its PostCSS plugin to @tailwindcss/postcss and changed
      # config; the v3 setup here breaks `next build`. Migrate deliberately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16's plugins (import, jsx-a11y, react) peer-depend on
      # eslint <=9; eslint 10 makes `npm ci` fail. Lift once they support 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch low-risk updates into a single PR to reduce noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions workflow versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
