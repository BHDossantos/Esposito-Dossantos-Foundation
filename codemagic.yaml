# Manual archive builds only. Configure existing signing identities in Codemagic
# separately after owner review. These workflows do not submit to either store.
workflows:
  ios-capacitor:
    name: iOS signed archive (manual)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.espositodossantosfoundation.app
    scripts:
      - name: Validate
        script: |
          npm ci
          npm run typecheck
          npm run test:mobile
      - name: Generate native project
        script: |
          npm run cap:add:ios -- --packagemanager SPM
          npm run cap:assets -- --ios
          npm run cap:sync -- ios
      - name: Apply existing signing profiles
        script: xcode-project use-profiles
      - name: Build signed archive
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-capacitor:
    name: Android release validation (unsigned, manual)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Validate
        script: |
          npm ci
          npm run typecheck
          npm run test:mobile
      - name: Generate native project
        script: |
          npm run cap:add:android
          npm run cap:assets -- --android
          npm run cap:sync -- android
      - name: Build unsigned bundle
        script: |
          cd android
          ./gradlew --no-daemon bundleRelease lintRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/reports/**
